<div class="bell-container">
  <button class="bell-btn" (click)="toggleOpen()" aria-label="Notifications">
    🔔
    @if (unreadCount > 0) {
      <span class="badge">{{ unreadCount }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="dropdown">
      @if (notifications().length === 0) {
        <p class="empty-text">No notifications yet.</p>
      } @else {
        @for (n of notifications(); track n.id) {
          <div class="notification-item" [class.unread]="!n.isRead" (click)="onMarkAsRead(n)">
            <p>{{ n.content }}</p>
            <span class="notif-time">{{ n.createdAt | date:'short' }}</span>
          </div>
        }
      }
    </div>
  }
</div>
